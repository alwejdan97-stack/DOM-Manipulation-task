<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
        <script src="script2.js"></script>
</head>
<body>

    <h1>My To-Do List</h1>

    <div class="counter-container">
        <span>Total: <strong id="countAll">0</strong></span> | 
        <span>Active: <strong id="countActive">0</strong></span> | 
        <span>Completed: <strong id="countCompleted">0</strong></span>
    </div>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter task description...">
        <button id="addBtn" onclick="addTask">Add Task</button>
    </div>

    <div class="filter-section">
        <button id="filterAll" class="filter-btn active-filter">All</button>
        <button id="filterActive" class="filter-btn">Active</button>
        <button id="filterCompleted" class="filter-btn">Completed</button>
    </div>

    <div id="taskContainer"></div>
</body>
</html>
